<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script>
    if (window.location.pathname.includes('/admin')) {
      var base = window.location.pathname.replace(/\/admin\/?$/, '');
      window.location.replace(base + '/#admin');
    } else {
      window.location.replace('/convite/');
    }
  </script>
</head>
<body>
</body>
</html>
